name: API contract

# Static CRD compatibility check from red-hat-data-services/api-contract-tests
# (RHOAIENG-103152). Compares the CRDs in a pull request with an immutable
# baseline commit and fails on removed CRDs or API versions, served or
# storage-version changes, removed schema fields, newly required fields, type
# changes, enum narrowing and default changes. It does not replace conversion,
# admission or upgrade tests.
#
# This repository owns one CRD, generated by `make manifests`:
#   config/crd/bases/components.platform.opendatahub.io_aigateways.yaml
# The CRDs under config/manifests/ belong to other projects and are only
# bundled here for deployment; the coverage job lists them as exclusions.
# There is no .rhoai/contracts.yaml: the repository has no OpenAPI documents,
# so the coverage job runs in CRD-only mode.
#
# The reusable workflows are pinned to the "latest" tag of api-contract-tests
# (v2.2.0 when this file was added), so new releases are adopted without a
# change here. See
# https://github.com/red-hat-data-services/api-contract-tests/blob/main/docs/releasing.md
# before changing the pin.
#
# Baseline: 21cbdcd7a9ab918a212e03323076a2a0d28f42a2, the head of main when
# this pull request was opened (2026-11-18), per the RHOAIENG-103152 rule: this
# repository has no GA release tag (odh-v3.5-EA2 is a pre-release) and no
# release* branch. Everything in the CRD at that commit must stay compatible.
# Moving the baseline needs approval from someone other than the author of
# the change.
#
# Runs on every pull request to main, with no path filter, so a CRD added
# anywhere in the repository reaches the coverage job.

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  crd-contract:
    permissions:
      contents: read
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-crd-check.yml@latest
    with:
      crd-glob: config/crd/bases/*.yaml
      baseline-refs: 21cbdcd7a9ab918a212e03323076a2a0d28f42a2 # main when this PR was opened (2026-11-18)
      mode: enforce

  # Every CRD manifest in the repository must be matched by the glob above or
  # by one of the exclusions below.
  crd-contract-coverage:
    permissions:
      contents: read
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      crd-globs: config/crd/bases/*.yaml
      # Excluded CRD manifests: CRDs of other projects, copied in by
      # hack/scripts/get-manifests.sh for deployment only. No Go code in this
      # repository defines their API groups; they are checked where they are
      # defined, not here.
      #  - aigatewaycontroller (from ai-gateway-controller):
      #    aigateway.opendatahub.io (AIGuardrail)
      #  - aigrid (from praxis-ai-grid-operator): grid.praxis.fast
      #    (AgentToolProvider, GridNetwork, GridSite, InferenceProvider,
      #    SiteInvite), listed one by one so a CRD added by a Grid bump fails
      #    coverage until it is reviewed and excluded here
      #  - batchgateway (from llm-d-batch-gateway-operator): batch.llm-d.ai
      #    (LLMBatchGateway)
      #  - maascontroller (from models-as-a-service): maas.opendatahub.io and
      #    inference.opendatahub.io (ExternalModel, ExternalProvider)
      crd-exclude-globs: >-
        config/manifests/aigatewaycontroller/crd/bases/*.yaml
        config/manifests/aigrid/crds/agenttoolprovider.yaml
        config/manifests/aigrid/crds/gridnetwork.yaml
        config/manifests/aigrid/crds/gridsite.yaml
        config/manifests/aigrid/crds/inferenceprovider.yaml
        config/manifests/aigrid/crds/siteinvite.yaml
        config/manifests/batchgateway/crd/bases/*.yaml
        config/manifests/maascontroller/crd/bases/*.yaml
      baseline-refs: 21cbdcd7a9ab918a212e03323076a2a0d28f42a2 # main when this PR was opened (2026-11-18)
      yq-version: "4.45.1"
      mode: enforce
