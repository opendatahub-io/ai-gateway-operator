name: CI

on:
  push:
  pull_request:

permissions: {}

env:
  CONTAINER_TOOL: docker

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  govulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Temporary non-blocking: remaining findings are Go stdlib CVEs that need a
      # newer toolchain patch than product/CI base images currently ship
      # (e.g. ubi go-toolset still on 1.26.2). Flip to blocking once the
      # toolchain pin is available.
      - name: Run govulncheck (non-blocking until Go toolchain patch is available)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./... || true

  test:
    permissions:
      contents: read
    name: Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: make test

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind

      - name: Download batch-gateway manifests
        run: make get-manifests

      - name: Integration tests
        run: make test-integration

  e2e:
    permissions:
      contents: read
    name: E2E
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind

      - name: Compute image reference
        id: img
        run: |
          IMG="ttl.sh/ai-gateway-operator-${GITHUB_SHA::7}:1h"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMG}"

      - name: Build and push image
        run: |
          make container-build IMG=${{ steps.img.outputs.img }}
          make container-push IMG=${{ steps.img.outputs.img }}

      - name: Compute ai-gateway-controller image reference
        id: ctrl_img
        run: |
          IMG="ttl.sh/ai-gateway-controller-${GITHUB_SHA::7}:1h"
          echo "img=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Using controller image: ${IMG}"

      - name: Build and push ai-gateway-controller image
        run: bash ./hack/scripts/build-e2e-controller-image.sh ${{ steps.ctrl_img.outputs.img }}

      - name: Run E2E tests
        env:
          RELATED_IMAGE_ODH_AI_GATEWAY_CONTROLLER_IMAGE: ${{ steps.ctrl_img.outputs.img }}
        run: make test-e2e IMG=${{ steps.img.outputs.img }}

      - name: Show pod logs on failure
        if: failure()
        run: |
          NS="ai-gateway-system"
          echo "=== AIGateway status ==="
          kubectl get aigateway default-aigateway -o yaml 2>/dev/null || true
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n "${NS}" -o wide 2>/dev/null || true
          echo ""
          echo "=== Module operator logs ==="
          kubectl logs -n "${NS}" -l app.kubernetes.io/name=ai-gateway-operator --tail=100 2>/dev/null || true
          echo ""
          echo "=== MaaS controller logs ==="
          for pod in $(kubectl get pods -n "${NS}" -l control-plane=maas-controller -o name 2>/dev/null); do
            echo "--- ${pod} current ---"
            kubectl logs -n "${NS}" "${pod}" --all-containers=true --tail=200 2>/dev/null || true
            echo "--- ${pod} previous ---"
            kubectl logs -n "${NS}" "${pod}" --previous --all-containers=true --tail=200 2>/dev/null || true
            echo "--- ${pod} describe ---"
            kubectl describe -n "${NS}" "${pod}" 2>/dev/null || true
          done
          echo ""
          echo "=== Batch-gateway operator logs ==="
          kubectl logs -n "${NS}" -l app.kubernetes.io/name=batch-gateway-operator --tail=100 2>/dev/null || true
          echo ""
          echo "=== AI Gateway controller logs ==="
          for pod in $(kubectl get pods -n "${NS}" -l control-plane=ai-gateway-controller -o name 2>/dev/null); do
            echo "--- ${pod} current ---"
            kubectl logs -n "${NS}" "${pod}" --all-containers=true --tail=200 2>/dev/null || true
            echo "--- ${pod} previous ---"
            kubectl logs -n "${NS}" "${pod}" --previous --all-containers=true --tail=200 2>/dev/null || true
            echo "--- ${pod} describe ---"
            kubectl describe -n "${NS}" "${pod}" 2>/dev/null || true
          done
          echo ""
          echo "=== Events ==="
          kubectl get events -n "${NS}" --sort-by='.lastTimestamp' 2>/dev/null || true
