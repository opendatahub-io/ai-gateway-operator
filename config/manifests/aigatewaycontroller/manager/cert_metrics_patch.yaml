apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-controller
  namespace: opendatahub
spec:
  template:
    spec:
      containers:
        - name: manager
          volumeMounts:
            - mountPath: /tmp/k8s-metrics-server/metrics-certs
              name: metrics-certs
              readOnly: true
      volumes:
        - name: metrics-certs
          secret:
            secretName: ai-gateway-controller-metrics-tls
