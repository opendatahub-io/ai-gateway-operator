# Permissions ai-gateway-controller needs to render+apply the vendored
# praxis-extproc overlay (config/manifests/praxis-extproc/overlays/odh) — see
# DESIGN.md. Verified against a live OpenShift cluster; every Kind here is one
# this controller actually creates/updates/deletes, no wildcard groups/resources
# (matches AC5 in downloads/ai-gateway-controller-poc.jira).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-gateway-controller-role
rules:
# Resources rendered from the vendored overlay.
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.istio.io"]
  resources: ["envoyfilters", "destinationrules"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Manage the payload-processing-reader ClusterRole/ClusterRoleBinding by name.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["create", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  resourceNames: ["payload-processing-reader"]
  verbs: ["get", "patch", "delete"]
# Escalation-check mirror: ai-gateway-controller must hold every permission it
# grants via payload-processing-reader (see maas-controller's
# tenant_controller.go for the same pattern).
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["maas.opendatahub.io"]
  resources: ["externalmodels"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["maas.opendatahub.io"]
  resources: ["externalmodels/finalizers"]
  verbs: ["update"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders", "externalmodels"]
  verbs: ["get", "list", "watch", "create", "update"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders/status", "externalmodels/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["inference.opendatahub.io"]
  resources: ["externalproviders/finalizers", "externalmodels/finalizers"]
  verbs: ["update"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["networking.istio.io"]
  resources: ["serviceentries"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
# destinationrules already covered above (full CRUD, needed for the
# vendored overlay's own DestinationRule), so no separate mirror rule is
# needed here.
# Leader election (--leader-elect) and event recording.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
